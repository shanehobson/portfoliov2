<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c6b58" />
    <meta
      name="description"
      content="Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure."
    />
    <!--
      The two things that paint the fold: the self-hosted variable font
      (crossorigin because font fetches are always CORS) and the cut-out
      portrait standing in the middle of the hero. The portrait's srcset and
      sizes are copied from Hero.jsx and must stay identical to it, or the
      browser preloads one file and then fetches another. No href: a browser
      without imagesrcset support just skips the preload.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/shane-cutout-480.webp 480w, /images/shane-cutout-640.webp 640w, /images/shane-cutout.webp 931w"
      imagesizes="(max-width: 45rem) 320px, (max-width: 75rem) 56vh, (max-height: 1051px) 73vh, 763px"
      fetchpriority="high"
    />
    <link rel="canonical" href="https://shanehobson.me/" />

    <!--
      Link previews. og:image must be an absolute URL and is served as JPEG
      rather than WebP because several scrapers, LinkedIn's included, still
      handle WebP badly. 1200x630 is the size every network crops from.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shane Hobson" />
    <meta property="og:url" content="https://shanehobson.me/" />
    <meta property="og:title" content="Shane Hobson - Software Engineer" />
    <meta property="og:description" content="Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure." />
    <meta property="og:image" content="https://shanehobson.me/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shane Hobson, software engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shane Hobson - Software Engineer" />
    <meta name="twitter:description" content="Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure." />
    <meta name="twitter:image" content="https://shanehobson.me/images/og-image.jpg" />
    <meta name="twitter:image:alt" content="Shane Hobson, software engineer" />

    <title>Shane Hobson - Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
