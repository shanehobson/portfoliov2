<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c6b58" />
    <meta
      name="description"
      content="Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure."
    />
    <!--
      The two things that paint the fold: the self-hosted variable font
      (crossorigin because font fetches are always CORS) and the cut-out
      portrait standing in the middle of the hero. The portrait's srcset and
      sizes are copied from Hero.jsx and must stay identical to it, or the
      browser preloads one file and then fetches another. No href: a browser
      without imagesrcset support just skips the preload.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/shane-cutout-480.webp 480w, /images/shane-cutout-640.webp 640w, /images/shane-cutout.webp 931w"
      imagesizes="(max-width: 45rem) 320px, (max-width: 75rem) 56vh, (max-height: 1051px) 73vh, 763px"
      fetchpriority="high"
    />
    <link rel="canonical" href="https://shanehobson.me/" />
    <meta name="author" content="Shane Hobson" />
    <!--
      The default is index,follow already; what this is here for is
      max-image-preview, which is what lets Google show the portrait at full
      width in a result or in Discover rather than as a thumbnail.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Shane Hobson"
      href="/blog/feed.xml"
    />
    <!--
      The two files written for crawlers that feed language models: this page
      as Markdown (scripts/prerender.mjs, from the same render as the HTML),
      and the index of the whole site at /llms.txt.
    -->
    <link
      rel="alternate"
      type="text/markdown"
      title="Shane Hobson - Software Engineer (Markdown)"
      href="/index.md"
    />

    <!--
      Link previews. og:image must be an absolute URL and is served as JPEG
      rather than WebP because several scrapers, LinkedIn's included, still
      handle WebP badly. 1200x630 is the size every network crops from.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Shane Hobson" />
    <meta property="og:url" content="https://shanehobson.me/" />
    <meta property="og:title" content="Shane Hobson - Software Engineer" />
    <meta property="og:description" content="Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure." />
    <meta property="og:image" content="https://shanehobson.me/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shane Hobson, software engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shane Hobson - Software Engineer" />
    <meta name="twitter:description" content="Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure." />
    <meta name="twitter:image" content="https://shanehobson.me/images/og-image.jpg" />
    <meta name="twitter:image:alt" content="Shane Hobson, software engineer" />

    <title>Shane Hobson - Software Engineer</title>

    <!--
      One @graph rather than several loose blocks, so the Person, the site and
      this page are the same three nodes everywhere on the site: the blog's
      generated pages reuse these @ids (scripts/build-blog.mjs) and hang their
      articles off them. The Person is the node that matters — it is what ties
      the profiles under sameAs to this domain.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://shanehobson.me/#person",
            "name": "Shane Hobson",
            "givenName": "Shane",
            "familyName": "Hobson",
            "url": "https://shanehobson.me/",
            "image": "https://shanehobson.me/images/shane.webp",
            "jobTitle": "Software Engineer",
            "description": "Software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure. Formerly a litigation and trial attorney, and still licensed.",
            "knowsAbout": [
              "Software engineering",
              "Frontend development",
              "Backend development",
              "Cloud infrastructure",
              "TypeScript",
              "React",
              "Angular",
              "Node.js",
              "GraphQL",
              "PostgreSQL",
              "Amazon Web Services",
              "AWS CDK",
              "Large language models",
              "Legal technology"
            ],
            "hasCredential": [
              {
                "@type": "EducationalOccupationalCredential",
                "credentialCategory": "certificate",
                "name": "AWS Certified Solutions Architect"
              },
              {
                "@type": "EducationalOccupationalCredential",
                "credentialCategory": "certificate",
                "name": "AWS Certified Cloud Practitioner"
              }
            ],
            "sameAs": [
              "https://www.linkedin.com/in/shane-hobson-1a979158/",
              "https://github.com/shanehobson",
              "https://medium.com/@shanehobson1"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://shanehobson.me/#website",
            "url": "https://shanehobson.me/",
            "name": "Shane Hobson",
            "description": "Portfolio and writing of Shane Hobson, software engineer.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://shanehobson.me/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://shanehobson.me/#webpage",
            "url": "https://shanehobson.me/",
            "name": "Shane Hobson - Software Engineer",
            "description": "Shane Hobson is a software engineer with a decade of experience building applications for the web, spanning frontend, backend, and cloud infrastructure.",
            "isPartOf": { "@id": "https://shanehobson.me/#website" },
            "about": { "@id": "https://shanehobson.me/#person" },
            "mainEntity": { "@id": "https://shanehobson.me/#person" },
            "primaryImageOfPage": "https://shanehobson.me/images/og-image.jpg",
            "inLanguage": "en-US"
          },
          {
            "@type": "Book",
            "@id": "https://shanehobson.me/#book",
            "name": "How To Become a Self-Taught Software Developer",
            "author": { "@id": "https://shanehobson.me/#person" },
            "url": "https://www.amazon.com/How-Become-Self-Taught-Software-Developer/dp/B0CCCHSC82",
            "inLanguage": "en-US"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
